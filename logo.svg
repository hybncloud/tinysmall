<svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg">
  <title>TinySmall Logo</title>
  <defs>
    <linearGradient id="ts-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5E7CE0"/>
      <stop offset="100%" stop-color="#5073E5"/>
    </linearGradient>
    <linearGradient id="ts-yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#FF9D00"/>
    </linearGradient>
  </defs>

  <!-- Icon: large wireframe cube (TinyVue) nesting a small solid cube (Small) -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- outer wireframe cube -->
    <g fill="none" stroke="url(#ts-blue)" stroke-width="2">
      <polygon points="20,5 6,12 6,28 20,35 34,28 34,12 20,5"/>
      <polyline points="6,12 20,19 34,12"/>
      <line x1="20" y1="19" x2="20" y2="35"/>
    </g>
    <!-- inner solid cube -->
    <g stroke="none">
      <polygon points="20,13.5 14,16.5 20,19.5 26,16.5" fill="url(#ts-yellow)"/>
      <polygon points="14,16.5 20,19.5 20,26.5 14,23.5" fill="#5E7CE0"/>
      <polygon points="20,19.5 26,16.5 26,23.5 20,26.5" fill="#5073E5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="52" y="29" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="24" font-weight="700">
    <tspan fill="#242424">Tiny</tspan><tspan fill="#5E7CE0">Small</tspan>
  </text>
</svg>
